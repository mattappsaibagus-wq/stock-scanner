name: Stock Scan

on:
  schedule:
    # All times UTC. GitHub can start scheduled runs late (sometimes hours),
    # so every run records its real time in data.json as generated_at and the
    # dashboard flags anything that missed the latest close.
    #
    # Tokyo lunch break: 02:45 UTC = 11:45 JST (morning session complete).
    # Replaces the old 00:00 UTC (09:00 JST) run, which fired at the open while
    # Yahoo's ~20 min delay still showed the previous day's prices.
    - cron: '45 2 * * 1-5'
    # Tokyo after close: 06:45 UTC = 15:45 JST (TSE closes 15:30 JST).
    # This is the run that captures the official Tokyo close.
    - cron: '45 6 * * 1-5'
    # US session: 14:00 UTC Mon-Fri (US morning; also re-confirms Tokyo close)
    - cron: '0 14 * * 1-5'
    # US after close: 21:30 UTC (after 16:00 ET in both EDT and EST)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
  # Redeploy Pages whenever the scanner or the dashboard itself changes, so UI
  # updates go live immediately instead of waiting for the next weekday scan.
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'agents/**'
      - 'run_pipeline.py'
      - 'requirements.txt'
      - 'watchlist.txt'
      - '.github/workflows/scan.yml'

# Never run two scans at once: overlapping runs race to push data.json.
concurrency:
  group: stock-scan
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    environment: github-pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: signals
          path: data/signals.json

      - name: Commit dashboard data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- dashboard/data.json)" ]; then
            git add dashboard/data.json
            git commit -m "Update dashboard data.json [skip ci]"
            # Rebase onto anything pushed while this run was scanning.
            git pull --rebase origin main
            git push
          else
            echo "No change to dashboard/data.json, skipping commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4

      - name: Trigger Render redeploy (keeps mirror site fresh)
        # The hook is read inside the script: a step's own env isn't visible to
        # its `if:`, so the old `if: env.RENDER_DEPLOY_HOOK != ''` never ran.
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set - tokyostockradar.onrender.com will not update"
            exit 0
          fi
          if curl -fsS -X POST "$RENDER_DEPLOY_HOOK"; then
            echo "Render deploy triggered"
          else
            echo "::warning::Render deploy hook failed (Pages deploy already succeeded)"
          fi
