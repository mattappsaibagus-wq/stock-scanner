name: Stock Scan

on:
  schedule:
    # US session: 14:00 UTC Mon-Fri (10:00 ET, after Tokyo close same day)
    - cron: '0 14 * * 1-5'
    # Tokyo session open: 00:00 UTC Mon-Fri (09:00 JST)
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
  # Redeploy Pages whenever the scanner or the dashboard itself changes, so UI
  # updates go live immediately instead of waiting for the next weekday scan.
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'agents/**'
      - 'run_pipeline.py'
      - 'requirements.txt'
      - 'watchlist.txt'
      - '.github/workflows/scan.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    environment: github-pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: signals
          path: data/signals.json

      - name: Commit dashboard data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- dashboard/data.json)" ]; then
            git add dashboard/data.json
            git commit -m "Update dashboard data.json [skip ci]"
            git push
          else
            echo "No change to dashboard/data.json, skipping commit"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4

      - name: Trigger Render redeploy (keeps mirror site fresh)
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" \
            && echo "Render deploy triggered" \
            || echo "WARN: Render deploy hook failed (non-fatal - Pages deploy already succeeded)"
